function formatRetailPackage(item,qty,type,days){
  if(type==='egg'){
    const count=Math.ceil(qty);
    if(count<=6)return'6 eggs (1/2 dozen)';
    if(count<=12)return'12 eggs (1 dozen)';
    if(count<=24)return'24 eggs (2 dozen)';
    if(count<=30)return'30 eggs (1 tray)';
    if(count<=60)return count+' eggs (2 trays)';
    return count+' eggs ('+Math.ceil(count/30)+' trays)'
  }
  if(type==='g'){
    const g=Math.ceil(qty);
    if(g<=100)return'100 g pack';
    if(g<=250)return'250 g pack';
    if(g<=500)return'500 g pack';
    if(g<=1000)return'1 kg pack';
    if(g<=2000)return'2 kg pack';
    if(g<=5000)return'5 kg bag';
    const kg=Math.ceil((g/1000)*2)/2;
    return(kg%1===0?kg.toFixed(0):kg.toFixed(1))+' kg'
  }
  if(type==='ml'){
    const ml=Math.ceil(qty);
    if(ml<=250)return'250 ml pack';
    if(ml<=500)return'500 ml pouch';
    if(ml<=1000)return'1 L bottle';
    if(ml<=2000)return'2 L pack';
    return Math.ceil(ml/1000)+' L'
  }
  if(type==='slice'){
    const s=Math.ceil(qty);
    return s<=12?'1 loaf (400g bread)':Math.ceil(s/12)+' loaves (400g bread)'
  }
  if(type==='banana'){
    const count=Math.ceil(qty);
    if(count<=6)return'6 pcs (half dozen)';
    if(count<=12)return'12 pcs (1 dozen)';
    return count+' pcs ('+Math.ceil(count/12)+' dozen)'
  }
  if(type==='apple'){
    const count=Math.ceil(qty);
    return count<=4?count+' pcs (~500g)':Math.ceil(count/4)*500+' g (~'+count+' apples)'
  }
  if(type==='lemon'){
    const count=Math.ceil(qty);
    return(days>7?Math.min(count,12):Math.min(count,6))+' pcs'
  }
  if(type==='bunch'){
    const bunches=Math.ceil(qty/250)||1;
    return bunches<=1?'1 bunch (250g)':bunches+' bunches ('+(bunches*250)+'g)'
  }
  if(type==='cabbage'||type==='cauliflower'){
    const pcs=Math.ceil(qty/500)||1;
    return pcs<=1?'1 pc (~500g)':pcs+' pcs (~'+(pcs*500)+'g)'
  }
  if(type==='punnet'){
    const punnets=Math.ceil(qty/200)||1;
    return punnets<=1?'1 punnet (200g)':punnets+' punnets ('+(punnets*200)+'g)'
  }
  if(type==='pack'||type==='pouch'||type==='spice_pack'){
    return'1 pack ('+(days>7?'100g':'50g')+')'
  }
  if(type==='salt_pack'){
    return'1 packet (1 kg)'
  }
  if(type==='jar'||type==='bottle'){
    return'1 standard pack'
  }
  return Math.ceil(qty)+' '+type
}

function shop(a,b,n){
  const map={},days=b-a;
  for(let d=a;d<b&&d<S.plan.length;d++){
    SO.forEach(s=>{
      const r=R[S.plan[d][s]];if(!r)return;
      const q=pt(r,s)*n;
      r.g.forEach(l=>{
        const norm=parseGroceryLine(l,q);
        if(!norm)return;
        const key=norm.cat+'|'+norm.item+'|'+norm.type;
        map[key]=(map[key]||0)+norm.qty;
      })
    })
  }
  const g={};
  Object.keys(map).forEach(k=>{
    const [cat,item,type]=k.split('|');
    g[cat]=g[cat]||[];
    g[cat].push([item,formatRetailPackage(item,map[k],type,days),k])
  });
  Object.keys(g).forEach(c=>g[c].sort((x,y)=>x[0]<y[0]?-1:1));
  return{g,pan:[]}
}
